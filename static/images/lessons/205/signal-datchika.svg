<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="340" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Как датчик отдаёт показания: три способа</text>

  <!-- токовая петля -->
  <rect x="20" y="60" width="300" height="230" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="170" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Токовая петля 4–20 мА</text>
  <rect x="55" y="110" width="70" height="46" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="139" text-anchor="middle" font-size="11" fill="#1e3a8a">датчик</text>
  <line x1="125" y1="133" x2="215" y2="133" stroke="#3b82f6" stroke-width="3"/>
  <rect x="215" y="110" width="80" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="255" y="139" text-anchor="middle" font-size="11" fill="#1e3a8a">вход ПЛК</text>
  <text x="170" y="192" text-anchor="middle" font-size="12" fill="#334155">4 мА = минимум, 20 мА = максимум</text>
  <text x="170" y="216" text-anchor="middle" font-size="12" fill="#16A34A">ток не зависит от длины провода</text>
  <text x="170" y="246" text-anchor="middle" font-size="12" fill="#6b7280">самый надёжный способ</text>
  <text x="170" y="270" text-anchor="middle" font-size="11" fill="#9ca3af">так подключают датчики давления, уровня, температуры</text>

  <!-- напряжение -->
  <rect x="340" y="60" width="300" height="230" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="490" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Напряжение 0–10 В</text>
  <rect x="375" y="110" width="70" height="46" rx="6" fill="#bbf7d0" stroke="#16A34A" stroke-width="2"/>
  <text x="410" y="139" text-anchor="middle" font-size="11" fill="#166534">датчик</text>
  <line x1="445" y1="133" x2="535" y2="133" stroke="#16A34A" stroke-width="3"/>
  <rect x="535" y="110" width="80" height="46" rx="6" fill="#dcfce7" stroke="#16A34A" stroke-width="2"/>
  <text x="575" y="139" text-anchor="middle" font-size="11" fill="#166534">вход ПЛК</text>
  <text x="490" y="192" text-anchor="middle" font-size="12" fill="#334155">0 В = ноль, 10 В = максимум</text>
  <text x="490" y="216" text-anchor="middle" font-size="12" fill="#b45309">падение на длинном проводе врёт</text>
  <text x="490" y="246" text-anchor="middle" font-size="12" fill="#6b7280">проще и дешевле</text>
  <text x="490" y="270" text-anchor="middle" font-size="11" fill="#9ca3af">годится на коротких линиях</text>

  <!-- дискретный -->
  <rect x="660" y="60" width="320" height="230" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="820" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Дискретный сигнал</text>
  <rect x="700" y="110" width="70" height="46" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="735" y="139" text-anchor="middle" font-size="11" fill="#92400e">датчик</text>
  <line x1="770" y1="133" x2="860" y2="133" stroke="#b45309" stroke-width="3"/>
  <rect x="860" y="110" width="80" height="46" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="900" y="139" text-anchor="middle" font-size="11" fill="#92400e">вход ПЛК</text>
  <text x="820" y="192" text-anchor="middle" font-size="12" fill="#334155">есть / нет, 0 или 24 В</text>
  <text x="820" y="216" text-anchor="middle" font-size="12" fill="#16A34A">«дверь открыта», «деталь на месте»</text>
  <text x="820" y="246" text-anchor="middle" font-size="12" fill="#6b7280">концевики, кнопки, датчики присутствия</text>
  <text x="820" y="270" text-anchor="middle" font-size="11" fill="#9ca3af">никакой точности, только факт</text>

  <text x="500" y="320" text-anchor="middle" font-size="13" fill="#374151">Для модели это значит: <tspan font-weight="bold">способ передачи определяет, что ты получишь</tspan> — число, число с ошибкой или одно из двух состояний.</text>
</svg>
