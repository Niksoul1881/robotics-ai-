<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Рабочее место крупным планом: откуда берутся данные</text>

  <!-- станок -->
  <rect x="60" y="70" width="430" height="230" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
  <text x="275" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Станок с ЧПУ</text>

  <!-- датчики -->
  <g fill="#EA580C" stroke="#7c2d12" stroke-width="1.5">
    <rect x="86" y="112" width="34" height="20" rx="3"/>
    <rect x="128" y="112" width="34" height="20" rx="3"/>
    <rect x="170" y="112" width="34" height="20" rx="3"/>
  </g>
  <text x="86" y="152" font-size="10.5" fill="#7c2d12">датчики: вибрация, ток, температура</text>

  <!-- патрон -->
  <rect x="100" y="190" width="44" height="56" rx="5" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <text x="122" y="264" text-anchor="middle" font-size="11" fill="#334155">патрон</text>

  <!-- пруток -->
  <rect x="144" y="208" width="140" height="22" rx="3" fill="#94a3b8"/>
  <text x="214" y="198" text-anchor="middle" font-size="11" fill="#334155">пруток</text>

  <!-- шпиндель -->
  <circle cx="214" cy="219" r="6" fill="#2563eb"/>
  <text x="214" y="252" text-anchor="middle" font-size="10.5" fill="#2563eb">шпиндель</text>

  <!-- резец -->
  <path d="M300,248 L340,248 L340,212 z" fill="#dc2626"/>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#991b1b">резец</text>
  <text x="320" y="288" text-anchor="middle" font-size="9.5" fill="#6b7280">снимает стружку</text>

  <!-- стойка -->
  <rect x="388" y="180" width="88" height="104" rx="8" fill="#111827"/>
  <text x="432" y="208" text-anchor="middle" font-size="11" fill="#e5e7eb">стойка</text>
  <text x="432" y="226" text-anchor="middle" font-size="11" fill="#e5e7eb">ЧПУ</text>
  <text x="432" y="256" text-anchor="middle" font-size="9.5" fill="#9ca3af">экран +</text>
  <text x="432" y="270" text-anchor="middle" font-size="9.5" fill="#9ca3af">программа</text>

  <!-- оператор -->
  <circle cx="580" cy="150" r="26" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="580" y="157" text-anchor="middle" font-size="15" fill="#92400e">Ч</text>
  <text x="580" y="196" text-anchor="middle" font-size="12" fill="#92400e">оператор</text>
  <text x="580" y="214" text-anchor="middle" font-size="10.5" fill="#6b7280">следит, меняет</text>
  <text x="580" y="230" text-anchor="middle" font-size="10.5" fill="#6b7280">детали, нажимает</text>

  <!-- контроллер -->
  <rect x="660" y="110" width="150" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="735" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Контроллер сбора</text>
  <text x="735" y="162" text-anchor="middle" font-size="11" fill="#3b82f6">собирает сигналы</text>
  <text x="735" y="180" text-anchor="middle" font-size="11" fill="#3b82f6">и отдаёт в сеть</text>

  <!-- сервер -->
  <rect x="830" y="110" width="150" height="100" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="905" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">Сервер / MES</text>
  <text x="905" y="162" text-anchor="middle" font-size="11" fill="#7c3aed">база, журнал</text>
  <text x="905" y="180" text-anchor="middle" font-size="11" fill="#7c3aed">операций</text>

  <!-- связи -->
  <g stroke="#EA580C" stroke-width="2.5">
    <line x1="492" y1="180" x2="524" y2="166"/>
    <line x1="608" y1="164" x2="656" y2="160"/>
  </g>
  <line x1="812" y1="160" x2="826" y2="160" stroke="#8b5cf6" stroke-width="2.5"/>

  <text x="500" y="334" text-anchor="middle" font-size="13.5" fill="#374151">Станок умеет управлять инструментом, но не умеет рассказывать, что с ним происходит.</text>
  <text x="500" y="360" text-anchor="middle" font-size="13.5" fill="#374151">Поэтому рядом ставят датчики и контроллер — они и превращают процесс в данные.</text>
  <text x="500" y="386" text-anchor="middle" font-size="12.5" fill="#EA580C">Вот здесь, на этом уровне, и начинается промышленный ML.</text>
</svg>
