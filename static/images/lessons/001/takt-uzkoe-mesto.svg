<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Такт и узкое место: почему ускорить всё сразу нельзя</text>

  <g font-size="13">
    <!-- шкала операций -->
    <text x="30" y="70" font-size="13" fill="#6b7280">длительность операции</text>

    <rect x="200" y="82" width="80" height="34" rx="6" fill="#93c5fd"/>
    <text x="290" y="105" font-size="13" fill="#1e3a8a">40 с — отрезная</text>

    <rect x="200" y="126" width="360" height="34" rx="6" fill="#dc2626"/>
    <text x="572" y="149" font-size="13" fill="#991b1b" font-weight="bold">180 с — точение (узкое место)</text>

    <rect x="200" y="170" width="300" height="34" rx="6" fill="#93c5fd"/>
    <text x="512" y="193" font-size="13" fill="#1e3a8a">150 с — фрезеровка</text>

    <rect x="200" y="214" width="180" height="34" rx="6" fill="#93c5fd"/>
    <text x="392" y="237" font-size="13" fill="#1e3a8a">90 с — шлифовка</text>

    <!-- такт -->
    <line x1="560" y1="76" x2="560" y2="258" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="566" y="76" font-size="13" font-weight="bold" fill="#dc2626">такт = 180 с</text>

    <!-- вывод -->
    <line x1="30" y1="268" x2="970" y2="268" stroke="#e5e7eb" stroke-width="2"/>
    <text x="500" y="292" text-anchor="middle" font-size="14" fill="#374151">Деталь выходит раз в 180 с, сколько бы ты ни ускорял фрезеровку и шлифовку.</text>
    <text x="500" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">20 деталей в час. Ускоришь точение вдвое — станет 40.</text>
  </g>
</svg>
