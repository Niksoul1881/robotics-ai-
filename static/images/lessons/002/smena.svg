<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="320" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Одна смена: почему в данных всегда есть дырки</text>

  <line x1="40" y1="120" x2="960" y2="120" stroke="#cbd5e1" stroke-width="3"/>

  <!-- события -->
  <g font-size="11.5" fill="#6b7280" text-anchor="middle">
    <text x="60" y="150">08:00</text><text x="240" y="150">10:00</text><text x="420" y="150">12:00</text>
    <text x="600" y="150">14:00</text><text x="780" y="150">16:00</text><text x="940" y="150">17:00</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="60" y1="112" x2="60" y2="128"/><line x1="240" y1="112" x2="240" y2="128"/>
    <line x1="420" y1="112" x2="420" y2="128"/><line x1="600" y1="112" x2="600" y2="128"/>
    <line x1="780" y1="112" x2="780" y2="128"/><line x1="940" y1="112" x2="940" y2="128"/>
  </g>

  <!-- работа -->
  <g fill="#fed7aa" stroke="#EA580C" stroke-width="1.5">
    <rect x="60" y="86" width="120" height="28" rx="4"/>
    <rect x="270" y="86" width="110" height="28" rx="4"/>
    <rect x="470" y="86" width="90" height="28" rx="4"/>
    <rect x="640" y="86" width="110" height="28" rx="4"/>
    <rect x="820" y="86" width="120" height="28" rx="4"/>
  </g>
  <!-- простои -->
  <g fill="#fecaca" stroke="#dc2626" stroke-width="1.5">
    <rect x="180" y="86" width="90" height="28" rx="4"/>
    <rect x="380" y="86" width="90" height="28" rx="4"/>
    <rect x="560" y="86" width="80" height="28" rx="4"/>
    <rect x="750" y="86" width="70" height="28" rx="4"/>
  </g>

  <!-- подписи -->
  <g font-size="11.5" text-anchor="middle">
    <text x="225" y="76" fill="#991b1b">переналадка</text>
    <text x="425" y="76" fill="#991b1b">обед</text>
    <text x="600" y="76" fill="#991b1b">смена</text>
    <text x="600" y="62" fill="#991b1b">инструмента</text>
    <text x="785" y="76" fill="#991b1b">сбой</text>
  </g>

  <line x1="40" y1="180" x2="960" y2="180" stroke="#e5e7eb" stroke-width="2"/>
  <text x="500" y="208" text-anchor="middle" font-size="13.5" fill="#374151">Восемь часов смены — это не восемь часов выпуска. Реально станок работает 6–6,5 часов.</text>
  <text x="500" y="234" text-anchor="middle" font-size="13.5" fill="#374151">Всё, что в красном, — простой. И именно он чаще всего и есть узкое место, а не скорость обработки.</text>
  <text x="500" y="264" text-anchor="middle" font-size="13" fill="#EA580C" font-weight="bold">Поэтому в данных появляются пропуски: пока станок стоит, датчики либо молчат, либо пишут нули.</text>
  <text x="500" y="288" text-anchor="middle" font-size="12.5" fill="#6b7280">Различить «станок выключен» и «датчик отвалился» — отдельная задача (курс 9).</text>
</svg>
