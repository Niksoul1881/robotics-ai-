<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="340" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Кто есть кто в цеху и с кем придётся разговаривать</text>

  <g font-size="12">
    <!-- оператор -->
    <rect x="20" y="50" width="180" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="110" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Оператор</text>
    <text x="110" y="106" text-anchor="middle" font-size="20">🧑‍🏭</text>
    <text x="110" y="134" text-anchor="middle" fill="#6b7280">стоит у станка</text>
    <text x="110" y="154" text-anchor="middle" fill="#6b7280">ставит детали, следит</text>
    <text x="110" y="182" text-anchor="middle" fill="#16A34A" font-weight="bold">знает, где болит</text>

    <!-- наладчик -->
    <rect x="214" y="50" width="180" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="304" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Наладчик</text>
    <text x="304" y="106" text-anchor="middle" font-size="20">🔧</text>
    <text x="304" y="134" text-anchor="middle" fill="#6b7280">настраивает станок</text>
    <text x="304" y="154" text-anchor="middle" fill="#6b7280">меняет инструмент</text>
    <text x="304" y="182" text-anchor="middle" fill="#16A34A" font-weight="bold">даст данные о режимах</text>

    <!-- технолог -->
    <rect x="408" y="50" width="180" height="150" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="498" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Технолог</text>
    <text x="498" y="106" text-anchor="middle" font-size="20">📋</text>
    <text x="498" y="134" text-anchor="middle" fill="#6b7280">пишет ТЗ и режимы</text>
    <text x="498" y="154" text-anchor="middle" fill="#6b7280">отвечает за процесс</text>
    <text x="498" y="182" text-anchor="middle" fill="#16A34A" font-weight="bold">главный эксперт</text>

    <!-- контролёр -->
    <rect x="602" y="50" width="180" height="150" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="692" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">Контролёр</text>
    <text x="692" y="106" text-anchor="middle" font-size="20">📏</text>
    <text x="692" y="134" text-anchor="middle" fill="#6b7280">меряет детали</text>
    <text x="692" y="154" text-anchor="middle" fill="#6b7280">ставит брак</text>
    <text x="692" y="182" text-anchor="middle" fill="#16A34A" font-weight="bold">единственный источник разметки</text>

    <!-- мастер -->
    <rect x="796" y="50" width="184" height="150" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="888" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Мастер участка</text>
    <text x="888" y="106" text-anchor="middle" font-size="20">🗂</text>
    <text x="888" y="134" text-anchor="middle" fill="#6b7280">отвечает за план</text>
    <text x="888" y="154" text-anchor="middle" fill="#6b7280">и людей</text>
    <text x="888" y="182" text-anchor="middle" fill="#16A34A" font-weight="bold">пропустит или заблокирует</text>
  </g>

  <line x1="20" y1="222" x2="980" y2="222" stroke="#e5e7eb" stroke-width="2"/>
  <text x="500" y="250" text-anchor="middle" font-size="14" fill="#374151">Работа ML-инженера — на 30% код и на 70% разговоры с этими людьми.</text>
  <text x="500" y="276" text-anchor="middle" font-size="13" fill="#6b7280">Без контролёра нет разметки. Без технолога нет понимания, что считать дефектом.</text>
  <text x="500" y="302" text-anchor="middle" font-size="13" fill="#dc2626">Без мастера модель не попадёт на линию, даже если она идеальна.</text>
</svg>
