<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Где на маршруте появляются данные</text>

  <!-- линия маршрута -->
  <line x1="60" y1="110" x2="940" y2="110" stroke="#cbd5e1" stroke-width="3"/>
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="130" y="140">склад</text><text x="280" y="140">отрезка</text><text x="430" y="140">точение</text>
    <text x="580" y="140">фрезеровка</text><text x="730" y="140">контроль</text><text x="880" y="140">отгрузка</text>
  </g>

  <!-- точки данных -->
  <g>
    <circle cx="130" cy="110" r="9" fill="#EA580C"/>
    <circle cx="280" cy="110" r="9" fill="#EA580C"/>
    <circle cx="430" cy="110" r="9" fill="#dc2626"/>
    <circle cx="580" cy="110" r="9" fill="#dc2626"/>
    <circle cx="730" cy="110" r="9" fill="#7c3aed"/>
    <circle cx="880" cy="110" r="9" fill="#2563eb"/>
  </g>

  <!-- подписи данных -->
  <g font-size="11.5">
    <rect x="52" y="156" width="156" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="64" y="176" fill="#7c2d12" font-weight="bold">партия, номер</text>
    <text x="64" y="196" fill="#4b5563">из накладной</text>
    <text x="64" y="214" fill="#9ca3af">MES</text>

    <rect x="216" y="156" width="136" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="228" y="176" fill="#7c2d12" font-weight="bold">время резки</text>
    <text x="228" y="196" fill="#4b5563">из станка</text>
    <text x="228" y="214" fill="#9ca3af">стойка ЧПУ</text>

    <rect x="366" y="156" width="160" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="378" y="176" fill="#991b1b" font-weight="bold">вибрация, ток</text>
    <text x="378" y="196" fill="#4b5563">датчики</text>
    <text x="378" y="214" fill="#9ca3af">1000 раз в секунду</text>

    <rect x="540" y="156" width="150" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="552" y="176" fill="#991b1b" font-weight="bold">ток фрезы</text>
    <text x="552" y="196" fill="#4b5563">датчик</text>
    <text x="552" y="214" fill="#9ca3af">может не быть!</text>

    <rect x="668" y="156" width="150" height="70" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="680" y="176" fill="#5b21b6" font-weight="bold">годна / брак</text>
    <text x="680" y="196" fill="#4b5563">контролёр</text>
    <text x="680" y="214" fill="#9ca3af">разметка!</text>

    <rect x="838" y="156" width="120" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="850" y="176" fill="#1e3a8a" font-weight="bold">отгрузка</text>
    <text x="850" y="196" fill="#4b5563">1С / ERP</text>
    <text x="850" y="214" fill="#9ca3af">из накладной</text>
  </g>

  <line x1="40" y1="248" x2="960" y2="248" stroke="#e5e7eb" stroke-width="2"/>
  <text x="500" y="274" text-anchor="middle" font-size="13" fill="#374151">Зелёные точки — данные есть всегда. <tspan fill="#dc2626">Красные</tspan> — только если поставили датчики.</text>
  <text x="500" y="300" text-anchor="middle" font-size="13" fill="#7c3aed">Фиолетовая — разметка «брак», и без неё не обучить классификатор.</text>
  <text x="500" y="330" text-anchor="middle" font-size="13" fill="#7c2d12" font-weight="bold">Правило: сначала найти, где лежит нужное, а потом думать о модели.</text>
  <text x="500" y="356" text-anchor="middle" font-size="12" fill="#9ca3af">Часто оказывается, что нужных данных просто нет — и это меняет всю постановку задачи.</text>
</svg>
