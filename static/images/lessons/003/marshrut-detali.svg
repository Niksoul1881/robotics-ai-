<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Путь одной детали по цеху: от склада до отгрузки</text>

  <!-- этапы -->
  <g font-size="11.5" text-anchor="middle">
    <!-- склад -->
    <rect x="14" y="70" width="112" height="120" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
    <text x="70" y="94" font-size="12.5" font-weight="bold" fill="#92400e">Склад</text>
    <text x="70" y="114" fill="#a16207">прутки</text>
    <text x="70" y="132" fill="#a16207">партия</text>
    <text x="70" y="164" fill="#6b7280">10 мин</text>

    <!-- отрезка -->
    <rect x="146" y="70" width="112" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="202" y="94" font-size="12.5" font-weight="bold" fill="#1e40af">Отрезка</text>
    <text x="202" y="114" fill="#3b82f6">заготовка</text>
    <text x="202" y="132" fill="#3b82f6">40 с</text>
    <text x="202" y="164" fill="#6b7280">+ 3 мин очередь</text>

    <!-- точение -->
    <rect x="278" y="70" width="112" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="334" y="94" font-size="12.5" font-weight="bold" fill="#1e40af">Точение</text>
    <text x="334" y="114" fill="#3b82f6">Ø12 h7</text>
    <text x="334" y="132" fill="#3b82f6">180 с</text>
    <text x="334" y="164" fill="#dc2626">узкое место</text>

    <!-- фрезеровка -->
    <rect x="410" y="70" width="112" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="466" y="94" font-size="12.5" font-weight="bold" fill="#1e40af">Фрезеровка</text>
    <text x="466" y="114" fill="#3b82f6">шпоночный</text>
    <text x="466" y="132" fill="#3b82f6">паз, 150 с</text>
    <text x="466" y="164" fill="#6b7280">+ 2 мин очередь</text>

    <!-- шлифовка -->
    <rect x="542" y="70" width="112" height="120" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="598" y="94" font-size="12.5" font-weight="bold" fill="#1e40af">Шлифовка</text>
    <text x="598" y="114" fill="#3b82f6">шероховатость</text>
    <text x="598" y="132" fill="#3b82f6">90 с</text>
    <text x="598" y="164" fill="#6b7280">+ мойка</text>

    <!-- контроль -->
    <rect x="674" y="70" width="112" height="120" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="730" y="94" font-size="12.5" font-weight="bold" fill="#5b21b6">Контроль</text>
    <text x="730" y="114" fill="#7c3aed">размер,</text>
    <text x="730" y="132" fill="#7c3aed">шероховатость</text>
    <text x="730" y="164" fill="#6b7280">60 с</text>

    <!-- склад готовой -->
    <rect x="806" y="70" width="112" height="120" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="862" y="94" font-size="12.5" font-weight="bold" fill="#7c2d12">Готовая</text>
    <text x="862" y="114" fill="#EA580C">упаковка</text>
    <text x="862" y="132" fill="#EA580C">отгрузка</text>
    <text x="862" y="164" fill="#6b7280">30 мин</text>

    <!-- брак -->
    <rect x="938" y="70" width="52" height="120" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="964" y="100" fill="#991b1b" font-size="11">брак</text>
    <text x="964" y="140" font-size="16">🗑</text>
  </g>

  <!-- стрелки -->
  <g stroke="#EA580C" stroke-width="2.5">
    <line x1="126" y1="130" x2="142" y2="130"/><line x1="258" y1="130" x2="274" y2="130"/>
    <line x1="390" y1="130" x2="406" y2="130"/><line x1="522" y1="130" x2="538" y2="130"/>
    <line x1="654" y1="130" x2="670" y2="130"/><line x1="786" y1="130" x2="802" y2="130"/>
  </g>
  <g stroke="#dc2626" stroke-width="2">
    <line x1="730" y1="190" x2="730" y2="214"/><line x1="730" y1="214" x2="964" y2="214"/><line x1="964" y1="214" x2="964" y2="192"/>
  </g>

  <line x1="14" y1="236" x2="986" y2="236" stroke="#e5e7eb" stroke-width="2"/>
  <text x="500" y="262" text-anchor="middle" font-size="13" fill="#374151">Такт определяет точение: 180 секунд. Остальные операции успевают между деталями.</text>
  <text x="500" y="288" text-anchor="middle" font-size="13" fill="#374151">Но у каждой операции есть ещё <tspan font-weight="bold">очередь</tspan> — детали ждут своей очереди. Это не работа, а ожидание.</text>
  <text x="500" y="316" text-anchor="middle" font-size="13" fill="#EA580C">Суммарное время одной детали от склада до отгрузки ≈ 4 часа, хотя обработка — 8 минут.</text>
  <text x="500" y="342" text-anchor="middle" font-size="12.5" fill="#6b7280">Разница между «8 минутами» и «4 часами» — это очереди и пролёживание. Именно там прячутся деньги.</text>
  <text x="500" y="372" text-anchor="middle" font-size="12" fill="#9ca3af">Брак может возникнуть на любой операции, но обнаруживается обычно только на контроле — или вообще у клиента.</text>
</svg>
