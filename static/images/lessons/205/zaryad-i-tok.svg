<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Что такое ток: движение зарядов по проводу</text>

  <!-- провод -->
  <rect x="60" y="80" width="880" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
  <text x="500" y="70" text-anchor="middle" font-size="12" fill="#6b7280">медный провод (в разрезе)</text>

  <!-- электроны -->
  <g fill="#2563eb">
    <circle cx="120" cy="110" r="9"/><circle cx="200" cy="140" r="9"/><circle cx="280" cy="105" r="9"/>
    <circle cx="360" cy="145" r="9"/><circle cx="440" cy="112" r="9"/><circle cx="520" cy="140" r="9"/>
    <circle cx="600" cy="108" r="9"/><circle cx="680" cy="143" r="9"/><circle cx="760" cy="110" r="9"/>
    <circle cx="840" cy="140" r="9"/>
  </g>
  <g font-size="11" fill="#1e3a8a" text-anchor="middle">
    <text x="120" y="114">−</text><text x="200" y="144">−</text><text x="280" y="109">−</text>
    <text x="360" y="149">−</text><text x="440" y="116">−</text><text x="520" y="144">−</text>
    <text x="600" y="112">−</text><text x="680" y="147">−</text><text x="760" y="114">−</text><text x="840" y="144">−</text>
  </g>

  <!-- направление -->
  <g stroke="#dc2626" stroke-width="3">
    <line x1="150" y1="196" x2="330" y2="196"/>
  </g>
  <path d="M330,190 L344,196 L330,202 z" fill="#dc2626"/>
  <text x="400" y="201" font-size="13" fill="#991b1b">направление тока — от «плюса» к «минусу»</text>

  <text x="500" y="240" text-anchor="middle" font-size="13.5" fill="#374151">В металле двигаются электроны — крошечные частицы с отрицательным зарядом.</text>
  <text x="500" y="266" text-anchor="middle" font-size="13.5" fill="#374151">Сами по себе они не летят через весь провод: один «толкает» другого, как в очереди.</text>
  <text x="500" y="296" text-anchor="middle" font-size="13" fill="#EA580C">Ток — это сколько заряда проходит через сечение за секунду. Измеряется в амперах (А).</text>
  <text x="500" y="318" text-anchor="middle" font-size="12" fill="#9ca3af">Предупреждение для точности: направление тока исторически приняли от плюса к минусу, хотя электроны идут наоборот.</text>
</svg>
