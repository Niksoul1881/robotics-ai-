<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Припуск: что снимают с заготовки</text>

  <!-- заготовка -->
  <text x="180" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Заготовка (пруток Ø20)</text>
  <rect x="80" y="96" width="200" height="70" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="131" x2="280" y2="131" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="180" y="190" text-anchor="middle" font-size="12" fill="#6b7280">диаметр 20 мм</text>

  <!-- деталь -->
  <text x="620" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Деталь (вал Ø12 h7)</text>
  <rect x="520" y="111" width="200" height="40" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="520" y1="131" x2="720" y2="131" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="620" y="190" text-anchor="middle" font-size="12" fill="#6b7280">диаметр 12 мм</text>

  <!-- стрелка припуска -->
  <line x1="290" y1="131" x2="510" y2="131" stroke="#EA580C" stroke-width="3"/>
  <path d="M510,125 L524,131 L510,137 z" fill="#EA580C"/>
  <text x="400" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">снимаем 4 мм с каждой стороны</text>
  <text x="400" y="156" text-anchor="middle" font-size="12" fill="#6b7280">припуск по диаметру = 8 мм</text>

  <!-- ошибки -->
  <rect x="60" y="216" width="420" height="90" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="80" y="242" font-size="12.5" font-weight="bold" fill="#991b1b">Сняли больше — брак по размеру</text>
  <text x="80" y="264" font-size="11.5" fill="#b91c1c">Деталь меньше Ø12 — уже не исправить. Только в брак.</text>
  <text x="80" y="286" font-size="11.5" fill="#6b7280">Поэтому черновой и чистовой проходы делают раздельно.</text>

  <rect x="520" y="216" width="420" height="90" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="540" y="242" font-size="12.5" font-weight="bold" fill="#92400e">Сняли меньше — не попали в допуск</text>
  <text x="540" y="264" font-size="11.5" fill="#a16207">Ø12,3 вместо Ø12 — можно дошлифовать, если есть припуск.</text>
  <text x="540" y="286" font-size="11.5" fill="#6b7280">Вот зачем нужен запас: он даёт второй шанс.</text>
</svg>
