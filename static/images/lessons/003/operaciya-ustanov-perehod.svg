<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Операция, установ и переход: три вложенных уровня</text>

  <!-- операция -->
  <rect x="20" y="50" width="960" height="240" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
  <text x="40" y="76" font-size="14" font-weight="bold" fill="#1e293b">Операция 2 · Точение</text>
  <text x="40" y="96" font-size="11.5" fill="#6b7280">выполняется на одном рабочем месте, без снятия детали</text>

  <!-- установ 1 -->
  <rect x="40" y="112" width="450" height="160" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="58" y="136" font-size="13" font-weight="bold" fill="#1e40af">Установ А</text>
  <text x="58" y="154" font-size="11" fill="#3b82f6">деталь зажали в патрон один раз</text>

  <rect x="58" y="168" width="414" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="193" font-size="11.5" fill="#1e3a8a">переход 1: точить Ø12 на длине 40 мм</text>

  <rect x="58" y="216" width="414" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="241" font-size="11.5" fill="#1e3a8a">переход 2: точить фаску 1×45°</text>

  <!-- установ 2 -->
  <rect x="510" y="112" width="450" height="160" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="528" y="136" font-size="13" font-weight="bold" fill="#166534">Установ Б</text>
  <text x="528" y="154" font-size="11" fill="#16A34A">деталь перевернули и зажали второй раз</text>

  <rect x="528" y="168" width="414" height="40" rx="6" fill="#dcfce7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="540" y="193" font-size="11.5" fill="#166534">переход 1: подрезать торец</text>

  <rect x="528" y="216" width="414" height="40" rx="6" fill="#dcfce7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="540" y="241" font-size="11.5" fill="#166534">переход 2: снять фаску</text>

  <text x="500" y="312" text-anchor="middle" font-size="12.5" fill="#374151">Каждая переустановка — это новый шанс получить погрешность: деталь встала чуть иначе.</text>
</svg>
