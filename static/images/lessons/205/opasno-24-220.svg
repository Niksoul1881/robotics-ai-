<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="360" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Почему 24 В не опасно, а 220 В опасно</text>

  <!-- 24V -->
  <rect x="30" y="60" width="450" height="250" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="255" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">24 В (питание датчиков)</text>
  <text x="255" y="130" text-anchor="middle" font-size="13" fill="#334155">Сопротивление тела ≈ 1000 Ом</text>
  <rect x="105" y="150" width="300" height="40" rx="8" fill="#dcfce7" stroke="#16A34A" stroke-width="2"/>
  <text x="255" y="176" text-anchor="middle" font-size="13" fill="#166534">ток через тело = 24 / 1000 = 0,024 А</text>
  <text x="255" y="220" text-anchor="middle" font-size="13" fill="#16A34A" font-weight="bold">24 мА — почувствуешь, но не опасно</text>
  <text x="255" y="248" text-anchor="middle" font-size="12.5" fill="#475569">можно касаться руками, работая на сухом полу</text>
  <text x="255" y="276" text-anchor="middle" font-size="12.5" fill="#6b7280">но всё равно: коротит, греется, выбивает предохранитель</text>
  <text x="255" y="298" text-anchor="middle" font-size="11.5" fill="#9ca3af">повреждённую изоляцию на 24 В всё равно надо чинить</text>

  <!-- 220V -->
  <rect x="520" y="60" width="450" height="250" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="745" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">220 В (розетка, силовой шкаф)</text>
  <text x="745" y="130" text-anchor="middle" font-size="13" fill="#334155">Сопротивление тела ≈ 1000 Ом</text>
  <rect x="595" y="150" width="300" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="745" y="176" text-anchor="middle" font-size="13" fill="#991b1b">ток через тело = 220 / 1000 = 0,22 А</text>
  <text x="745" y="220" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="bold">220 мА — смертельно опасный ток</text>
  <text x="745" y="248" text-anchor="middle" font-size="12.5" fill="#475569">опасно уже с 30 мА, а тут в семь раз больше</text>
  <text x="745" y="276" text-anchor="middle" font-size="12.5" fill="#6b7280">поэтому: не лезть, звать электрика, не снимать кожух</text>
  <text x="745" y="298" text-anchor="middle" font-size="11.5" fill="#9ca3af">даже «выключенный» шкаф может быть под напряжением</text>

  <text x="500" y="342" text-anchor="middle" font-size="13" fill="#374151">Опасна не «сила тока» сама по себе, а <tspan font-weight="bold">ток через тело</tspan>, который зависит от напряжения.</text>
</svg>
